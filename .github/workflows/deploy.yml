name: Deploy to S3 + CloudFront

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, commit to deploy (e.g. main)"
        required: false
        default: "main"
        type: string

env:
  S3_BUCKET: ${{ secrets.S3_BUCKET }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  CLOUDFRONT_DISTRIBUTION_ID: ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Checkout (manual dispatch)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Checkout (push event)
        if: github.event_name != 'workflow_dispatch'
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: yarn

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Build (static export)
        run: yarn build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Upload other assets (CSS, JS outside _next, images, fonts) with 1 day cache
        run: |
          aws s3 sync ./out s3://$S3_BUCKET \
            --delete \
            --exclude "_next/*" \
            --exclude "*.html" \
            --cache-control "public,max-age=86400"

      - name: Upload immutable Next assets with long cache
        run: |
          if [ -d "out/_next/static" ]; then
            aws s3 sync ./out/_next/static s3://$S3_BUCKET/_next/static \
              --cache-control "public,max-age=31536000,immutable"
          fi

      - name: Upload HTML with immediate revalidation
        run: |
          # Ensure HTML gets lowest TTL to allow quick rollouts
          find out -type f -name "*.html" -print0 | xargs -0 -I {} \
            aws s3 cp "{}" "s3://$S3_BUCKET/{}" \
              --cache-control "public,max-age=0,must-revalidate" \
              --content-type "text/html; charset=utf-8"

      - name: Create CloudFront invalidation
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "$CLOUDFRONT_DISTRIBUTION_ID" \
            --paths "/*"

